name: directus

# The production deployment on the finki-hub host (data.finki-hub.com, behind
# Caddy and Cloudflare). The secrets are env files beside this file, never in
# the repository:
#   secrets.env  SECRET, ADMIN_EMAIL, ADMIN_TOKEN, DB_PASSWORD,
#                POSTGRES_PASSWORD and the EMAIL_* SMTP settings
#   licence.env  LICENSE_KEY
#   storage.env  STORAGE_R2_KEY, STORAGE_R2_SECRET, STORAGE_R2_ENDPOINT,
#                STORAGE_R2_BUCKET (the R2 bucket holding uploaded files)
#   sso.env      AUTH_GITHUB_CLIENT_ID/_SECRET and AUTH_GOOGLE_CLIENT_ID/_SECRET
#                (the "Directus" GitHub OAuth app and Google OAuth client)
#   moodle-sync.env  FINKI_HUB_DATA_TOKEN (the "Moodle sync" admin user),
#                COURSES_CAS_USERNAME and COURSES_CAS_PASSWORD
services:
  directus:
    # Built by CI from this repository (Directus, CSV-import patch,
    # extensions); Watchtower pulls new versions.
    image: ghcr.io/finki-hub/data:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 127.0.0.1:8055:8055
    env_file:
      - path: ./secrets.env
        required: true
      - path: ./licence.env
        required: true
      - path: ./storage.env
        required: true
      # AUTH_GITHUB_CLIENT_ID/_SECRET, AUTH_GOOGLE_CLIENT_ID/_SECRET
      - path: ./sso.env
        required: true
    environment:
      PUBLIC_URL: https://data.finki-hub.com
      HOST: 0.0.0.0
      DB_CLIENT: pg
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: directus
      DB_USER: directus
      IMPORT_TIMEOUT: 15m
      MAX_PAYLOAD_SIZE: 10mb
      # Uploads go to R2 (the first location, under directus/); files uploaded
      # before stay in the local volume.
      STORAGE_LOCATIONS: r2,local
      STORAGE_R2_DRIVER: s3
      STORAGE_R2_REGION: auto
      STORAGE_R2_ROOT: directus
      STORAGE_LOCAL_DRIVER: local
      STORAGE_LOCAL_ROOT: ./uploads
      CORS_ENABLED: "true"
      CORS_ORIGIN: "*"
      CORS_CREDENTIALS: "false"
      RATE_LIMITER_ENABLED: "true"
      RATE_LIMITER_STORE: memory
      RATE_LIMITER_POINTS: 50
      RATE_LIMITER_DURATION: 1
      CACHE_ENABLED: "false"
      RETENTION_ENABLED: "true"
      TELEMETRY: "false"
      SESSION_COOKIE_SECURE: "true"
      REFRESH_TOKEN_COOKIE_SECURE: "true"
      # The client address as Cloudflare reports it, for the rate limiter.
      IP_CUSTOM_HEADER: cf-connecting-ip
      WEBSOCKETS_ENABLED: "false"
      LOG_LEVEL: info
      # Single sign-on: only users already linked to a GitHub login or a
      # Google email can sign in this way; nobody can register.
      AUTH_PROVIDERS: github,google
      AUTH_GITHUB_DRIVER: oauth2
      AUTH_GITHUB_LABEL: GitHub
      AUTH_GITHUB_ICON: github
      AUTH_GITHUB_AUTHORIZE_URL: https://github.com/login/oauth/authorize
      AUTH_GITHUB_ACCESS_URL: https://github.com/login/oauth/access_token
      AUTH_GITHUB_PROFILE_URL: https://api.github.com/user
      AUTH_GITHUB_SCOPE: read:user
      AUTH_GITHUB_IDENTIFIER_KEY: login
      AUTH_GITHUB_ALLOW_PUBLIC_REGISTRATION: "false"
      AUTH_GOOGLE_DRIVER: openid
      AUTH_GOOGLE_LABEL: Google
      AUTH_GOOGLE_ICON: google
      AUTH_GOOGLE_ISSUER_URL: https://accounts.google.com/.well-known/openid-configuration
      AUTH_GOOGLE_SCOPE: openid email profile
      AUTH_GOOGLE_IDENTIFIER_KEY: email
      AUTH_GOOGLE_ALLOW_PUBLIC_REGISTRATION: "false"
    volumes:
      - uploads:/directus/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8055/server/ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - ./secrets.env
    environment:
      POSTGRES_USER: directus
      POSTGRES_DB: directus
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directus -d directus"]
      interval: 10s
      timeout: 5s
      retries: 10

  # The weekly Moodle snapshot refresh, run by deploy/directus-moodle-sync.timer
  # and never started with the stack: courses-scraper scrapes the new Moodle
  # instance over the newest export in "Moodle snapshots (private)", uploads
  # the result there and runs "Data / Import Moodle snapshot".
  moodle-sync:
    image: ghcr.io/finki-hub/courses-scraper:latest
    profiles: [jobs]
    pull_policy: always
    labels:
      # Watchtower would kill a running refresh to "update" it; the job pulls
      # the latest image itself on every run.
      com.centurylinklabs.watchtower.enable: "false"
    env_file:
      - path: ./moodle-sync.env
        required: true
    environment:
      FINKI_HUB_DATA_URL: http://directus:8055
    volumes:
      # Resumable checkpoints of an interrupted scrape.
      - moodle-sync:/app/output

volumes:
  uploads:
  db:
  moodle-sync:
