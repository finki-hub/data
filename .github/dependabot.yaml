version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Vue stays at the exact version the Directus release ships (and
    # @directus/types requires); it moves with a Directus upgrade.
    ignore:
      - dependency-name: "vue"

  - package-ecosystem: "npm"
    directory: "/directus/extensions/directus-extension-data-operations"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Vue stays at the exact version the Directus release ships (and
    # @directus/types requires); it moves with a Directus upgrade.
    ignore:
      - dependency-name: "vue"

  - package-ecosystem: "npm"
    directory: "/directus/extensions/directus-extension-course-search"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Vue stays at the exact version the Directus release ships (and
    # @directus/types requires); it moves with a Directus upgrade.
    ignore:
      - dependency-name: "vue"
