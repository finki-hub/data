name: Integration

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Setup and /legacy on a real Directus
    # Needs the Directus licence (the model has more collections than an
    # unlicensed Directus allows), which pull requests from forks and
    # Dependabot do not receive; main runs it after every merge.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DIRECTUS_LICENSE_KEY: ${{ secrets.DIRECTUS_LICENSE_KEY }}
      DIRECTUS_URL: http://127.0.0.1:8055
      DIRECTUS_ADMIN_TOKEN: ci-admin-token
      DIRECTUS_INTEGRATION_URL: http://127.0.0.1:8055
      DIRECTUS_INTEGRATION_TOKEN: ci-admin-token
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Directus
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Install the model
        run: npm run setup

      - name: Install the model again (idempotent)
        run: npm run setup

      - name: Run the integration tests
        run: npm run test:integration

      - name: Directus logs
        if: failure()
        run: docker compose logs directus --tail 200
