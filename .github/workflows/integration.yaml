name: Integration

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Integration
    # Needs the Directus licence (the model has more collections than an
    # unlicensed Directus allows), which pull requests from forks and
    # Dependabot do not receive; main runs it after every merge.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DIRECTUS_LICENSE_KEY: ${{ secrets.DIRECTUS_LICENSE_KEY }}
      DIRECTUS_URL: http://127.0.0.1:8055
      DIRECTUS_ADMIN_TOKEN: ci-admin-token
      DIRECTUS_INTEGRATION_URL: http://127.0.0.1:8055
      DIRECTUS_INTEGRATION_TOKEN: ci-admin-token
      DIRECTUS_SEARCH_TEST_URL: http://127.0.0.1:8055
      DIRECTUS_SEARCH_TEST_TOKEN: ci-admin-token
      DIRECTUS_SEARCH_TEST_MARKER_COLLECTION: synthetic_search_marker_ci
      DIRECTUS_SEARCH_TEST_MARKER_VALUE: synthetic-ci
      DIRECTUS_E2E_URL: http://127.0.0.1:8055
      DIRECTUS_E2E_EMAIL: admin@example.com
      DIRECTUS_E2E_PASSWORD: change-me
      DIRECTUS_E2E_TOKEN: ci-admin-token
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Start Directus
        run: docker compose up --build --detach --wait --wait-timeout 300

      # The search and CSV suites build their own collections on the bare
      # project (the search suite its own moodle_users), so they run first.
      - name: Mark the project as disposable
        run: |
          curl -fsS -o /dev/null -X POST "$DIRECTUS_URL/collections"             -H "Authorization: Bearer $DIRECTUS_ADMIN_TOKEN" -H 'Content-Type: application/json'             -d '{"collection":"synthetic_search_marker_ci","fields":[{"field":"id","type":"integer","schema":{"is_primary_key":true,"has_auto_increment":true}},{"field":"marker","type":"string"}],"meta":{"hidden":true},"schema":{}}'
          curl -fsS -o /dev/null -X POST "$DIRECTUS_URL/items/synthetic_search_marker_ci"             -H "Authorization: Bearer $DIRECTUS_ADMIN_TOKEN" -H 'Content-Type: application/json'             -d '{"marker":"synthetic-ci"}'

      - name: Run the CSV import tests
        run: npm run test:csv

      - name: Run the course search tests
        run: npm run test:search

      - name: Install the model
        run: npm run setup

      - name: Install the model again (idempotent)
        run: npm run setup

      - name: Run the deployment tests
        run: npm run test:integration

      - name: Install Playwright Browsers
        run: npm run test:e2e:browsers

      - name: Run the Studio tests
        run: npm run test:e2e

      - name: Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - name: Directus logs
        if: failure()
        run: docker compose logs directus --tail 200
