sonar.organization=finki-hub
sonar.projectKey=finki-hub-data

sonar.sources=.
sonar.exclusions=**/*.sql,**/dist/**,test/fixtures/**

# Automatic analysis takes issue exclusions only from the project's settings
# on SonarCloud (sonar.issue.ignore.multicriteria), not from this file. The
# project excludes, with these reasons:
# - *:S9382 (await in a loop) in src/**, test/** and the extension files that
#   read or write in a required order (exports/engine.ts, index.ts,
#   snapshot/backup.ts, status-reads.ts): each request depends on the state
#   the one before it left;
# - typescript:S1523 in test/**: the tests run the managed Flows' own exec
#   scripts, as Directus does;
# - docker:S6596 in Dockerfile: the image follows the latest Directus release
#   on purpose and is rebuilt weekly;
# - Web:S6845 in course-search/src/search-results.vue: a horizontally scrolling table
#   must take keyboard focus to be scrollable without a mouse (WCAG 2.1.1);
# - githubactions:S7637 and githubactions:S8264 everywhere, as in every
#   finki-hub project: the shared workflows are referenced by branch and set
#   their permissions at workflow level.
