sonar.organization=finki-hub
sonar.projectKey=finki-hub-data

sonar.sources=.
sonar.exclusions=**/*.sql,**/dist/**,test/fixtures/**

sonar.issue.ignore.multicriteria=sequential,flowscripts,directustag

# Setup, migrations and test fixtures talk to Directus step by step on
# purpose: each request depends on the state the one before it left.
sonar.issue.ignore.multicriteria.sequential.ruleKey=*:S9382
sonar.issue.ignore.multicriteria.sequential.resourceKey=**/*

# The tests run the managed Flows' own exec scripts, as Directus does.
sonar.issue.ignore.multicriteria.flowscripts.ruleKey=typescript:S1523
sonar.issue.ignore.multicriteria.flowscripts.resourceKey=test/**/*

# The image follows the latest Directus release on purpose (rebuilt weekly).
sonar.issue.ignore.multicriteria.directustag.ruleKey=docker:S6596
sonar.issue.ignore.multicriteria.directustag.resourceKey=Dockerfile
