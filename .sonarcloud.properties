sonar.organization=finki-hub
sonar.projectKey=finki-hub-data

sonar.sources=.
sonar.exclusions=**/*.sql,**/dist/**,test/fixtures/**

sonar.issue.ignore.multicriteria=setup,tests,engine,migrations,backup,statusreads,flowscripts,directustag,scrollregion

# These talk to Directus or the database step by step on purpose: each
# request depends on the state the one before it left (setup, migrations,
# the export reads in their declared order, the snapshot backup's pages, the
# status reads of one dashboard answer, and the test fixtures).
sonar.issue.ignore.multicriteria.setup.ruleKey=*:S9382
sonar.issue.ignore.multicriteria.setup.resourceKey=src/**/*
sonar.issue.ignore.multicriteria.tests.ruleKey=*:S9382
sonar.issue.ignore.multicriteria.tests.resourceKey=test/**/*
sonar.issue.ignore.multicriteria.engine.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.engine.resourceKey=directus/extensions/directus-extension-data-operations/src/exports/engine.ts
sonar.issue.ignore.multicriteria.migrations.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.migrations.resourceKey=directus/extensions/directus-extension-data-operations/src/index.ts
sonar.issue.ignore.multicriteria.backup.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.backup.resourceKey=directus/extensions/directus-extension-data-operations/src/snapshot/backup.ts
sonar.issue.ignore.multicriteria.statusreads.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.statusreads.resourceKey=directus/extensions/directus-extension-data-operations/src/status-reads.ts

# The tests run the managed Flows' own exec scripts, as Directus does.
sonar.issue.ignore.multicriteria.flowscripts.ruleKey=typescript:S1523
sonar.issue.ignore.multicriteria.flowscripts.resourceKey=test/**/*

# The image follows the latest Directus release on purpose (rebuilt weekly).
sonar.issue.ignore.multicriteria.directustag.ruleKey=docker:S6596
sonar.issue.ignore.multicriteria.directustag.resourceKey=Dockerfile

# A horizontally scrolling table must take keyboard focus to be scrollable
# without a mouse (WCAG 2.1.1).
sonar.issue.ignore.multicriteria.scrollregion.ruleKey=Web:S6845
sonar.issue.ignore.multicriteria.scrollregion.resourceKey=directus/extensions/directus-extension-course-search/src/results.vue
